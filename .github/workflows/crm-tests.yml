name: CRM Test Suite

on:
  push:
    paths:
      - "CRM/**"
      - ".github/workflows/crm-tests.yml"
  pull_request:
    paths:
      - "CRM/**"
      - ".github/workflows/crm-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRM
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test -v 1
